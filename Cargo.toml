[package]
name = "codeglance-pro"
version = "0.1.0"
edition = "2024"
description = "CodeGlance Pro-style editor minimap plugin for OpenIDEA"
license = "Apache-2.0"
publish = false

# Standalone plugin built outside any IDE workspace (`wasm32-wasip2`).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
