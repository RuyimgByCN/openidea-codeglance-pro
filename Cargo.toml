[package]
name = "codeglance-pro"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone plugin built outside any IDE workspace (`wasm32-wasip2`).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { path = "../openidea/sdk/rust/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
